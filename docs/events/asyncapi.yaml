asyncapi: 3.0.0
info:
  title: Eventos del sistema bancario
  version: 1.0.0
  description: |
    Eventos que los microservicios intercambian por Kafka. Las funcionalidades nuevas se comunican
    solo por eventos: no invocan por REST las APIs de otros microservicios.
    Cada mensaje es JSON; la clave del mensaje es el id de la entidad del evento.
servers:
  local:
    host: localhost:9092
    protocol: kafka
    description: Kafka de docker-compose desde el host (los contenedores usan kafka:29092)
channels:
  customerEvents:
    address: customer-events
    description: Eventos de clientes. Dueño y productor, customer-service (3 particiones).
    messages:
      customerCreated:
        $ref: '#/components/messages/CustomerCreated'
      customerUpdated:
        $ref: '#/components/messages/CustomerUpdated'
      customerClosed:
        $ref: '#/components/messages/CustomerClosed'
  creditEvents:
    address: credit-events
    description: Productos de crédito otorgados, modificados o dados de baja. Dueño y productor, credit-service (3 particiones).
    messages:
      creditGranted:
        $ref: '#/components/messages/CreditGranted'
      creditCardGranted:
        $ref: '#/components/messages/CreditCardGranted'
      creditUpdated:
        $ref: '#/components/messages/CreditUpdated'
      creditCardUpdated:
        $ref: '#/components/messages/CreditCardUpdated'
      creditClosed:
        $ref: '#/components/messages/CreditClosed'
      creditCardClosed:
        $ref: '#/components/messages/CreditCardClosed'
  transactionEvents:
    address: transaction-events
    description: Pagos y consumos de productos de crédito. Dueño y productor, transaction-service (3 particiones).
    messages:
      creditPaymentRegistered:
        $ref: '#/components/messages/CreditPaymentRegistered'
      creditCardPaymentRegistered:
        $ref: '#/components/messages/CreditCardPaymentRegistered'
      creditCardChargeRegistered:
        $ref: '#/components/messages/CreditCardChargeRegistered'
  debitCardEvents:
    address: debit-card-events
    description: Tarjetas de débito emitidas, con cuentas cambiadas o dadas de baja. Dueño y productor, account-service (3 particiones).
    messages:
      debitCardIssued:
        $ref: '#/components/messages/DebitCardIssued'
      debitCardAccountsUpdated:
        $ref: '#/components/messages/DebitCardAccountsUpdated'
      debitCardClosed:
        $ref: '#/components/messages/DebitCardClosed'
  debtEvents:
    address: debt-events
    description: Cambios en el estado de deuda de los clientes. Dueño y productor, debt-service (3 particiones).
    messages:
      customerDebtStatusChanged:
        $ref: '#/components/messages/CustomerDebtStatusChanged'
  yankiEvents:
    address: yanki-events
    description: Monederos Yanki creados o dados de baja. Dueño y productor, yanki-service (3 particiones).
    messages:
      walletCreated:
        $ref: '#/components/messages/WalletCreated'
      walletClosed:
        $ref: '#/components/messages/WalletClosed'
  yankiOperations:
    address: yanki-operations
    description: |
      Cargos y abonos que yanki-service pide sobre la cuenta principal de la tarjeta de débito de
      un monedero. Dueño y productor, yanki-service (3 particiones).
    messages:
      yankiAccountDebitRequested:
        $ref: '#/components/messages/YankiAccountDebitRequested'
      yankiAccountCreditRequested:
        $ref: '#/components/messages/YankiAccountCreditRequested'
  yankiOperationResults:
    address: yanki-operation-results
    description: Respuesta a cada cargo o abono pedido por yanki-service. Dueño y productor, transaction-service (3 particiones).
    messages:
      yankiOperationCompleted:
        $ref: '#/components/messages/YankiOperationCompleted'
      yankiOperationRejected:
        $ref: '#/components/messages/YankiOperationRejected'
operations:
  publishCustomerCreated:
    action: send
    channel:
      $ref: '#/channels/customerEvents'
    summary: customer-service publica CustomerCreated, CustomerUpdated o CustomerClosed después de guardar el cliente.
    messages:
      - $ref: '#/channels/customerEvents/messages/customerCreated'
      - $ref: '#/channels/customerEvents/messages/customerUpdated'
      - $ref: '#/channels/customerEvents/messages/customerClosed'
  consumeCustomerCreated:
    action: receive
    channel:
      $ref: '#/channels/customerEvents'
    summary: |
      auth-service (grupo auth-service, desde el inicio del tópico) guarda o reemplaza su copia del
      cliente para validar el registro de usuarios; con CustomerClosed elimina el usuario y la
      copia. Procesar dos veces el mismo evento no duplica nada.
    messages:
      - $ref: '#/channels/customerEvents/messages/customerCreated'
      - $ref: '#/channels/customerEvents/messages/customerUpdated'
      - $ref: '#/channels/customerEvents/messages/customerClosed'
  publishCreditEvents:
    action: send
    channel:
      $ref: '#/channels/creditEvents'
    summary: credit-service publica el estado completo de cada crédito o tarjeta al otorgarlo, modificarlo o darlo de baja.
  consumeCreditEvents:
    action: receive
    channel:
      $ref: '#/channels/creditEvents'
    summary: |
      debt-service (grupo debt-service) registra los productos de crédito de cada cliente; un
      *Updated reemplaza la copia y recalcula la deuda. Las bajas se ignoran (solo se da de baja un
      producto sin deuda).
  publishTransactionEvents:
    action: send
    channel:
      $ref: '#/channels/transactionEvents'
    summary: transaction-service publica cada pago a un crédito o tarjeta y cada consumo después de guardarlo.
  consumeTransactionEvents:
    action: receive
    channel:
      $ref: '#/channels/transactionEvents'
    summary: debt-service registra los pagos y consumos; un eventId repetido no se cuenta dos veces.
  publishDebitCardEvents:
    action: send
    channel:
      $ref: '#/channels/debitCardEvents'
    summary: account-service publica el estado completo de la tarjeta al emitirla, asociar una cuenta, cambiar la principal o darla de baja.
  consumeDebitCardEvents:
    action: receive
    channel:
      $ref: '#/channels/debitCardEvents'
    summary: |
      transaction-service (grupo transaction-service) guarda su copia de cada tarjeta (dueño y cuenta
      principal) en MongoDB con caché en Redis, para procesar los pagos con tarjeta sin REST; con
      DebitCardClosed la elimina.
  publishDebtEvents:
    action: send
    channel:
      $ref: '#/channels/debtEvents'
    summary: |
      debt-service publica el estado de un cliente solo cuando pasa a tener deuda vencida o deja de
      tenerla (al llegar un evento o en la revisión diaria).
  consumeDebtEvents:
    action: receive
    channel:
      $ref: '#/channels/debtEvents'
    summary: |
      account-service y credit-service (cada uno con su grupo) guardan el estado en su MongoDB con
      caché en Redis y rechazan nuevos productos a clientes con deuda vencida.
  publishWalletCreated:
    action: send
    channel:
      $ref: '#/channels/yankiEvents'
    summary: yanki-service publica WalletCreated al crear un monedero y WalletClosed al darlo de baja.
  consumeWalletCreated:
    action: receive
    channel:
      $ref: '#/channels/yankiEvents'
    summary: |
      auth-service (grupo auth-service, desde el inicio del tópico) guarda su copia del monedero
      (id y celular) en MongoDB con caché en Redis, para validar el registro del acceso al monedero;
      con WalletClosed elimina el acceso y la copia.
  publishYankiOperations:
    action: send
    channel:
      $ref: '#/channels/yankiOperations'
    summary: |
      yanki-service pide un cargo (pago desde una cuenta) o un abono (pago hacia una cuenta,
      devolución de un cargo, o saldo del monedero al asociar la tarjeta). Si no puede publicar,
      deshace lo hecho y responde 503.
  consumeYankiOperations:
    action: receive
    channel:
      $ref: '#/channels/yankiOperations'
    summary: |
      transaction-service (grupo transaction-service) registra el movimiento YANKI_PAYMENT_SENT,
      YANKI_PAYMENT_RECEIVED o YANKI_PAYMENT_REVERSAL con las reglas de la cuenta y guarda el
      resultado por operationId: un pedido repetido recibe la misma respuesta sin otro movimiento.
  publishYankiOperationResults:
    action: send
    channel:
      $ref: '#/channels/yankiOperationResults'
    summary: transaction-service responde cada operación Yanki, completada o rechazada con su motivo.
  consumeYankiOperationResults:
    action: receive
    channel:
      $ref: '#/channels/yankiOperationResults'
    summary: |
      yanki-service (grupo yanki-service) avanza el pago o la asociación de tarjeta: acredita el
      destino, pide devolver el cargo o devuelve el saldo al monedero. Una respuesta que no
      corresponde al paso actual (repetida) se ignora.
  consumeDebitCardEventsInYanki:
    action: receive
    channel:
      $ref: '#/channels/debitCardEvents'
    summary: |
      yanki-service (grupo yanki-service) guarda su copia de cada tarjeta (dueño y cuenta principal)
      en MongoDB con caché en Redis, para asociarla a un monedero y cargar o abonar su cuenta; con
      DebitCardClosed la elimina y la quita del monedero que la tenga.
components:
  messages:
    CustomerCreated:
      name: CustomerCreated
      contentType: application/json
      bindings:
        kafka:
          key:
            type: string
            description: Id del cliente
      payload:
        type: object
        required: [eventType, customerId, type, profile, occurredAt]
        properties:
          eventType:
            type: string
            const: CustomerCreated
          customerId:
            type: string
            example: 6650f1c2a4b5c6d7e8f90123
          type:
            type: string
            enum: [PERSONAL, BUSINESS]
          profile:
            type: string
            enum: [STANDARD, VIP, PYME]
          occurredAt:
            type: string
            format: date-time
            example: '2026-11-15T10:00:00Z'
    CreditGranted:
      name: CreditGranted
      contentType: application/json
      bindings:
        kafka:
          key:
            type: string
            description: Id del cliente
      payload:
        type: object
        required: [eventType, eventId, creditId, customerId, creditType, amount, dueDate, grantedAt, occurredAt]
        properties:
          eventType:
            type: string
            const: CreditGranted
          eventId:
            type: string
            format: uuid
            description: Id único del evento; permite descartar los repetidos
          creditId:
            type: string
          customerId:
            type: string
          creditType:
            type: string
            enum: [PERSONAL, BUSINESS]
          amount:
            type: number
            example: 10000.00
          dueDate:
            type: string
            format: date
          grantedAt:
            type: string
            format: date
          occurredAt:
            type: string
            format: date-time
    CreditCardGranted:
      name: CreditCardGranted
      contentType: application/json
      bindings:
        kafka:
          key:
            type: string
            description: Id del cliente
      payload:
        type: object
        required: [eventType, eventId, creditCardId, customerId, creditLimit, paymentDueDay, grantedAt, occurredAt]
        properties:
          eventType:
            type: string
            const: CreditCardGranted
          eventId:
            type: string
            format: uuid
            description: Id único del evento; permite descartar los repetidos
          creditCardId:
            type: string
          customerId:
            type: string
          creditLimit:
            type: number
          paymentDueDay:
            type: integer
            minimum: 1
            maximum: 28
          grantedAt:
            type: string
            format: date
          occurredAt:
            type: string
            format: date-time
    CreditPaymentRegistered:
      name: CreditPaymentRegistered
      contentType: application/json
      bindings:
        kafka:
          key:
            type: string
            description: Id del cliente
      payload:
        type: object
        required: [eventType, eventId, creditId, customerId, payerCustomerId, amount, date, occurredAt]
        properties:
          eventType:
            type: string
            const: CreditPaymentRegistered
          eventId:
            type: string
            format: uuid
            description: Id único del evento; permite descartar los repetidos
          creditId:
            type: string
          customerId:
            type: string
            description: Dueño del producto pagado; su deuda es la que baja
          payerCustomerId:
            type: string
            description: Cliente que hizo el pago (el dueño o un tercero)
          amount:
            type: number
          date:
            type: string
            format: date
          occurredAt:
            type: string
            format: date-time
    CreditCardPaymentRegistered:
      name: CreditCardPaymentRegistered
      contentType: application/json
      bindings:
        kafka:
          key:
            type: string
            description: Id del cliente
      payload:
        type: object
        required: [eventType, eventId, creditCardId, customerId, payerCustomerId, amount, date, occurredAt]
        properties:
          eventType:
            type: string
            const: CreditCardPaymentRegistered
          eventId:
            type: string
            format: uuid
            description: Id único del evento; permite descartar los repetidos
          creditCardId:
            type: string
          customerId:
            type: string
            description: Dueño del producto pagado; su deuda es la que baja
          payerCustomerId:
            type: string
            description: Cliente que hizo el pago (el dueño o un tercero)
          amount:
            type: number
          date:
            type: string
            format: date
          occurredAt:
            type: string
            format: date-time
    CreditCardChargeRegistered:
      name: CreditCardChargeRegistered
      contentType: application/json
      bindings:
        kafka:
          key:
            type: string
            description: Id del cliente
      payload:
        type: object
        required: [eventType, eventId, creditCardId, customerId, amount, date, occurredAt]
        properties:
          eventType:
            type: string
            const: CreditCardChargeRegistered
          eventId:
            type: string
            format: uuid
            description: Id único del evento; permite descartar los repetidos
          creditCardId:
            type: string
          customerId:
            type: string
          amount:
            type: number
          date:
            type: string
            format: date
          occurredAt:
            type: string
            format: date-time
    CustomerDebtStatusChanged:
      name: CustomerDebtStatusChanged
      contentType: application/json
      bindings:
        kafka:
          key:
            type: string
            description: Id del cliente
      payload:
        type: object
        required: [eventType, eventId, customerId, hasOverdueDebt, overdueAmount, occurredAt]
        properties:
          eventType:
            type: string
            const: CustomerDebtStatusChanged
          eventId:
            type: string
            format: uuid
            description: Id único del evento; permite descartar los repetidos
          customerId:
            type: string
          hasOverdueDebt:
            type: boolean
            description: true si tiene deuda vencida en algún producto de crédito
          overdueAmount:
            type: number
            description: Monto vencido total (0 si no tiene)
          occurredAt:
            type: string
            format: date-time
    DebitCardIssued:
      name: DebitCardIssued
      contentType: application/json
      bindings:
        kafka:
          key:
            type: string
            description: Id del cliente
      payload:
        type: object
        required: [eventType, eventId, debitCardId, customerId, primaryAccountId, accountIds, occurredAt]
        properties:
          eventType:
            type: string
            const: DebitCardIssued
          eventId:
            type: string
            format: uuid
            description: Id único del evento; permite descartar los repetidos
          debitCardId:
            type: string
          customerId:
            type: string
          primaryAccountId:
            type: string
            description: Cuenta de la que salen los pagos con la tarjeta
          accountIds:
            type: array
            description: Cuentas asociadas, empezando por la principal (cada cuenta, en una sola tarjeta)
            items:
              type: string
          occurredAt:
            type: string
            format: date-time
    DebitCardAccountsUpdated:
      name: DebitCardAccountsUpdated
      contentType: application/json
      bindings:
        kafka:
          key:
            type: string
            description: Id del cliente
      payload:
        type: object
        required: [eventType, eventId, debitCardId, customerId, primaryAccountId, accountIds, occurredAt]
        properties:
          eventType:
            type: string
            const: DebitCardAccountsUpdated
          eventId:
            type: string
            format: uuid
            description: Id único del evento; permite descartar los repetidos
          debitCardId:
            type: string
          customerId:
            type: string
          primaryAccountId:
            type: string
            description: Cuenta de la que salen los pagos con la tarjeta
          accountIds:
            type: array
            description: Cuentas asociadas, empezando por la principal (cada cuenta, en una sola tarjeta)
            items:
              type: string
          occurredAt:
            type: string
            format: date-time
    WalletCreated:
      name: WalletCreated
      contentType: application/json
      bindings:
        kafka:
          key:
            type: string
            description: Id del monedero
      payload:
        type: object
        required: [eventType, eventId, walletId, phone, occurredAt]
        properties:
          eventType:
            type: string
            const: WalletCreated
          eventId:
            type: string
            format: uuid
            description: Id único del evento; permite descartar los repetidos
          walletId:
            type: string
          phone:
            type: string
            description: Celular del monedero (9 dígitos); con él inicia sesión su dueño
            example: '987654321'
          occurredAt:
            type: string
            format: date-time
    YankiAccountDebitRequested:
      name: YankiAccountDebitRequested
      contentType: application/json
      description: 'Cargo a la cuenta: se registra como YANKI_PAYMENT_SENT con las reglas y la comisión de un retiro.'
      bindings:
        kafka:
          key:
            type: string
            description: Id de la cuenta (las operaciones de una cuenta se procesan en orden)
      payload:
        type: object
        required: [eventType, eventId, operationId, accountId, amount, date, reversal, occurredAt]
        properties:
          eventType:
            type: string
            const: YankiAccountDebitRequested
          eventId:
            type: string
            format: uuid
            description: Id único del evento; permite descartar los repetidos
          operationId:
            type: string
            description: Id de la operación en yanki-service (payment:{id}:debit|credit|refund o link:{id}:transfer)
            example: payment:6650f1c2a4b5c6d7e8f90123:debit
          accountId:
            type: string
            description: Cuenta principal de la tarjeta de débito del monedero
          amount:
            type: number
          date:
            type: string
            format: date
          reversal:
            type: boolean
            description: Solo en abonos; true si devuelve un cargo anterior (sin reglas ni comisión)
          occurredAt:
            type: string
            format: date-time
    YankiAccountCreditRequested:
      name: YankiAccountCreditRequested
      contentType: application/json
      description: 'Abono a la cuenta: YANKI_PAYMENT_RECEIVED (reglas y comisión de un depósito) o YANKI_PAYMENT_REVERSAL si reversal es true.'
      bindings:
        kafka:
          key:
            type: string
            description: Id de la cuenta (las operaciones de una cuenta se procesan en orden)
      payload:
        type: object
        required: [eventType, eventId, operationId, accountId, amount, date, reversal, occurredAt]
        properties:
          eventType:
            type: string
            const: YankiAccountCreditRequested
          eventId:
            type: string
            format: uuid
            description: Id único del evento; permite descartar los repetidos
          operationId:
            type: string
            description: Id de la operación en yanki-service (payment:{id}:debit|credit|refund o link:{id}:transfer)
            example: payment:6650f1c2a4b5c6d7e8f90123:debit
          accountId:
            type: string
            description: Cuenta principal de la tarjeta de débito del monedero
          amount:
            type: number
          date:
            type: string
            format: date
          reversal:
            type: boolean
            description: Solo en abonos; true si devuelve un cargo anterior (sin reglas ni comisión)
          occurredAt:
            type: string
            format: date-time
    YankiOperationCompleted:
      name: YankiOperationCompleted
      contentType: application/json
      description: Se registró el movimiento.
      bindings:
        kafka:
          key:
            type: string
            description: Id de la operación
      payload:
        type: object
        required: [eventType, eventId, operationId, occurredAt]
        properties:
          eventType:
            type: string
            const: YankiOperationCompleted
          eventId:
            type: string
            format: uuid
            description: Id único del evento; permite descartar los repetidos
          operationId:
            type: string
            description: Id de la operación en yanki-service (payment:{id}:debit|credit|refund o link:{id}:transfer)
            example: payment:6650f1c2a4b5c6d7e8f90123:debit
          occurredAt:
            type: string
            format: date-time
    YankiOperationRejected:
      name: YankiOperationRejected
      contentType: application/json
      description: No se registró el movimiento.
      bindings:
        kafka:
          key:
            type: string
            description: Id de la operación
      payload:
        type: object
        required: [eventType, eventId, operationId, reason, occurredAt]
        properties:
          eventType:
            type: string
            const: YankiOperationRejected
          eventId:
            type: string
            format: uuid
            description: Id único del evento; permite descartar los repetidos
          operationId:
            type: string
            description: Id de la operación en yanki-service (payment:{id}:debit|credit|refund o link:{id}:transfer)
            example: payment:6650f1c2a4b5c6d7e8f90123:debit
          reason:
            type: string
            description: Motivo del rechazo (cuenta inexistente, saldo insuficiente, límite de movimientos...)
          occurredAt:
            type: string
            format: date-time
    CustomerUpdated:
      name: CustomerUpdated
      summary: Se modificó el nombre o el perfil del cliente; trae el tipo y el perfil actuales.
      contentType: application/json
      bindings:
        kafka:
          key:
            type: string
            description: Id del cliente
      payload:
        type: object
        required: [eventType, customerId, type, profile, occurredAt]
        properties:
          eventType:
            type: string
            const: CustomerUpdated
          customerId:
            type: string
            example: 6650f1c2a4b5c6d7e8f90123
          type:
            type: string
            enum: [PERSONAL, BUSINESS]
          profile:
            type: string
            enum: [STANDARD, VIP, PYME]
          occurredAt:
            type: string
            format: date-time
            example: '2026-11-15T10:00:00Z'
    CustomerClosed:
      name: CustomerClosed
      summary: Se dio de baja al cliente (baja lógica); auth-service elimina su usuario.
      contentType: application/json
      bindings:
        kafka:
          key:
            type: string
            description: Id del cliente
      payload:
        type: object
        required: [eventType, customerId, type, profile, occurredAt]
        properties:
          eventType:
            type: string
            const: CustomerClosed
          customerId:
            type: string
            example: 6650f1c2a4b5c6d7e8f90123
          type:
            type: string
            enum: [PERSONAL, BUSINESS]
          profile:
            type: string
            enum: [STANDARD, VIP, PYME]
          occurredAt:
            type: string
            format: date-time
            example: '2026-11-15T10:00:00Z'
    CreditUpdated:
      name: CreditUpdated
      summary: Se cambió la fecha de vencimiento del crédito; trae su estado completo.
      contentType: application/json
      bindings:
        kafka:
          key:
            type: string
            description: Id del cliente
      payload:
        type: object
        required: [eventType, eventId, creditId, customerId, creditType, amount, dueDate, grantedAt, occurredAt]
        properties:
          eventType:
            type: string
            const: CreditUpdated
          eventId:
            type: string
            format: uuid
            description: Id único del evento; permite descartar los repetidos
          creditId:
            type: string
          customerId:
            type: string
          creditType:
            type: string
            enum: [PERSONAL, BUSINESS]
          amount:
            type: number
            example: 10000.00
          dueDate:
            type: string
            format: date
          grantedAt:
            type: string
            format: date
          occurredAt:
            type: string
            format: date-time
    CreditClosed:
      name: CreditClosed
      summary: Se dio de baja el crédito, ya pagado; trae su último estado.
      contentType: application/json
      bindings:
        kafka:
          key:
            type: string
            description: Id del cliente
      payload:
        type: object
        required: [eventType, eventId, creditId, customerId, creditType, amount, dueDate, grantedAt, occurredAt]
        properties:
          eventType:
            type: string
            const: CreditClosed
          eventId:
            type: string
