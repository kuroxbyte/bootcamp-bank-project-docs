# Levanta la solución completa: discovery-server (Eureka), config-server, api-gateway, los seis
# microservicios (cada uno con su propia instancia de MongoDB), Kafka y Redis.
# Para las pruebas de punta a punta: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up
# Uso: docker compose up --build
# Los puertos publicados en el host se pueden cambiar con las variables *_PORT.
name: bank

# Configuración común de las instancias de MongoDB.
x-mongo: &mongo
  image: mongo:7.0
  healthcheck:
    test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
    interval: 10s
    timeout: 5s
    retries: 10

services:
  customer-db:
    <<: *mongo
    ports:
      - "${CUSTOMER_DB_PORT:-27017}:27017"
    volumes:
      - customer-data:/data/db

  account-db:
    <<: *mongo
    ports:
      - "${ACCOUNT_DB_PORT:-27018}:27017"
    volumes:
      - account-data:/data/db

  credit-db:
    <<: *mongo
    ports:
      - "${CREDIT_DB_PORT:-27019}:27017"
    volumes:
      - credit-data:/data/db

  transaction-db:
    <<: *mongo
    ports:
      - "${TRANSACTION_DB_PORT:-27020}:27017"
    volumes:
      - transaction-data:/data/db

  auth-db:
    <<: *mongo
    ports:
      - "${AUTH_DB_PORT:-27021}:27017"
    volumes:
      - auth-data:/data/db

  debt-db:
    <<: *mongo
    ports:
      - "${DEBT_DB_PORT:-27022}:27017"
    volumes:
      - debt-data:/data/db

  # Message broker de los eventos entre microservicios, en modo KRaft (sin ZooKeeper).
  # Los contenedores usan kafka:29092; desde el host, localhost:9092.
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Si un consumidor se suscribe antes de que el dueño cree el tópico, Kafka lo crea con 3
      # particiones, igual que el dueño; con 1 partición el consumidor no vería las demás.
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Caché de datos maestros (sin persistencia: se reconstruye desde MongoDB).
  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  discovery-server:
    build: ./discovery-server
    environment:
      EUREKA_HOSTNAME: discovery-server
    ports:
      - "${DISCOVERY_SERVER_PORT:-8761}:8761"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  config-server:
    build: ./config-server
    environment:
      # En Docker se leen los archivos de config-repo montados en solo lectura (perfil native),
      # para que el contenedor no haga checkout ni escriba en el repositorio git del host.
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo/
      EUREKA_URL: http://discovery-server:8761/eureka/
    volumes:
      - ./config-repo:/config-repo:ro
    ports:
      - "${CONFIG_SERVER_PORT:-8888}:8888"
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-gateway:
    build: ./api-gateway
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  customer-service:
    build: ./customer-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      MONGODB_URI: mongodb://customer-db:27017/customer_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "${CUSTOMER_SERVICE_PORT:-8081}:8081"
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      customer-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  account-service:
    build: ./account-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      MONGODB_URI: mongodb://account-db:27017/account_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
    ports:
      - "${ACCOUNT_SERVICE_PORT:-8082}:8082"
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      account-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  credit-service:
    build: ./credit-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      MONGODB_URI: mongodb://credit-db:27017/credit_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
    ports:
      - "${CREDIT_SERVICE_PORT:-8083}:8083"
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      credit-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  transaction-service:
    build: ./transaction-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      MONGODB_URI: mongodb://transaction-db:27017/transaction_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "${TRANSACTION_SERVICE_PORT:-8084}:8084"
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      transaction-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  auth-service:
    build: ./auth-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      MONGODB_URI: mongodb://auth-db:27017/auth_db
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "${AUTH_SERVICE_PORT:-8085}:8085"
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # Sin API: solo consume y publica eventos; no se registra en Eureka.
  debt-service:
    build: ./debt-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      MONGODB_URI: mongodb://debt-db:27017/debt_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "${DEBT_SERVICE_PORT:-8086}:8086"
    depends_on:
      config-server:
        condition: service_healthy
      debt-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  customer-data:
  account-data:
  credit-data:
  transaction-data:
  auth-data:
  debt-data:
  kafka-data:
